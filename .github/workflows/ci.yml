name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flake-check:
    name: flake check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      # Runs the command tests and shellcheck, builds the generated skills, sets
      # up a project with the commands, and evaluates the flake-parts module.
      - name: Flake check
        run: nix flake check
