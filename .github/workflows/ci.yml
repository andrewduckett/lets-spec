name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flake-check:
    name: flake check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      # Runs the command tests and shellcheck, builds the generated skills, sets
      # up a project with the commands, and evaluates the flake-parts module.
      - name: Flake check
        run: nix flake check

  # Checks the folder that the release tarball is made from. It installs the
  # tools with mise, as a project would, and runs lets-sync from PATH.
  mise-smoke:
    name: mise smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build the release folder
        run: nix build .#dist

      - name: Install the tools with mise
        uses: jdx/mise-action@v2

      - name: Sync into a scratch project
        run: |
          set -euo pipefail
          export PATH="$PWD/result/bin:$PATH"
          export OPENSPEC_TELEMETRY=0
          scratch="$RUNNER_TEMP/project"
          mkdir -p "$scratch"
          cd "$scratch"
          git init -q
          lets-sync 2> "$RUNNER_TEMP/sync.err"
          cat "$RUNNER_TEMP/sync.err"
          test -f .agents/skills/openspec-propose/SKILL.md
          test ! -L .agents/skills/openspec-propose/SKILL.md
          git add -A
          lets-sync --check
          if grep -q "OpenSpec CLI on PATH" "$RUNNER_TEMP/sync.err"; then
            echo "lets-sync warned about the OpenSpec CLI version" >&2
            exit 1
          fi
          LETS_SPEC_SKILLS=ignored lets-sync
          # Git ignores only untracked files, so untrack them as the message says.
          git rm -r -q --cached .agents/skills/lets-* .agents/skills/openspec-* openspec/schemas/lets-*
          git check-ignore -q .agents/skills/lets-build
